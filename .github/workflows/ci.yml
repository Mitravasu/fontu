name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            qt-host: mac
            qt-arch: clang_64
            preset: release-macos
          - platform: windows-x86_64
            os: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2022_64
            preset: release-windows
          - platform: linux-x86_64
            os: ubuntu-22.04
            qt-host: linux
            qt-arch: linux_gcc_64
            preset: release-unix
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0
      - name: Install Qt
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt-host }}
          arch: ${{ matrix.qt-arch }}
          aqtversion: '==3.3.0'
          py7zrversion: '==0.22.0'
          cache: true
      - name: Configure Release build
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 3
      - name: Run all CTest suites
        run: ctest --preset ${{ matrix.preset }}
      - name: Diagnose failed CTest suites
        # CTest can show no output for crashing Windows tests. Rerun each failed test directly
        # with Qt messages forced to stderr and report its raw exit code.
        if: failure()
        shell: bash
        env:
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          failed = Path('build-release/Testing/Temporary/LastTestsFailed.log')
          names = {line.split(':', 1)[1].strip() for line in failed.read_text().splitlines() if ':' in line} if failed.exists() else set()
          tests = json.loads(subprocess.run(['ctest', '--preset', '${{ matrix.preset }}', '--show-only=json-v1'],
                                            capture_output=True, text=True, check=True).stdout)['tests']
          for test in tests:
              if test['name'] not in names:
                  continue
              print(f"::group::{test['name']}: {' '.join(test['command'])}", flush=True)
              result = subprocess.run(test['command'], cwd='build-release', capture_output=True, timeout=120)
              print(result.stdout.decode(errors='replace'))
              print(result.stderr.decode(errors='replace'))
              print(f"exit code {result.returncode} (0x{result.returncode & 0xffffffff:08x})")
              print('::endgroup::', flush=True)
          PY
      - name: Test release packaging scripts
        run: python -m unittest discover -s tests -p "test_*.py" -v
